; =============================================================================
; platformio.ini — Robot Tự Hành | Mã Dự Án: 1682
; Kiến trúc: Multi-Environment kế thừa từ [env:esp32dev]
; Mỗi environment chỉ biên dịch đúng 1 file .cpp của giai đoạn tương ứng.
; =============================================================================

; ─── MÔI TRƯỜNG GỐC (BASE) ────────────────────────────────────────────────────
; Tất cả các environment bên dưới kế thừa toàn bộ cấu hình này.
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Tốc độ Serial Monitor mặc định
monitor_speed = 115200
upload_speed  = 921600

; Thư viện cốt lõi dùng chung cho toàn dự án
lib_deps =
    vshymanskyy/TinyGSM @ ^0.11.7
    mobizt/FirebaseClient @ ^2.2.9
    pololu/VL53L0X @ ^1.3.1
    hideakitai/MPU9250 @ ^0.4.8
    mikalhart/TinyGPSPlus @ ^1.1.0
    plerup/EspSoftwareSerial @ ^8.2.0

; Build flags chung (có thể override tại từng env)
build_flags =
    -DCORE_DEBUG_LEVEL=0


; ─── ENV: MAIN — Giai đoạn 9: Firmware Tự Hành Tích Hợp Hoàn Chỉnh ──────────
[env:main]
extends       = env:esp32dev
; Chỉ biên dịch main.cpp, loại bỏ toàn bộ thư mục stages/
build_src_filter = +<main.cpp> -<stages/>


; ─── ENV: S1 — Giai đoạn 1: Điều Khiển L298N qua Wi-Fi Web Server ───────────
[env:s1]
extends          = env:esp32dev
; Loại bỏ tất cả, chỉ lấy đúng file stage1
build_src_filter = -<*> +<stages/stage1_wifi_motor.cpp>
upload_speed     = 115200
; Mỗi flag phải xuống dòng riêng — PlatformIO không tách space trong upload_flags
; --before no_reset: Bạn tự đặt ESP32 vào Download Mode TRƯỚC rồi mới chạy upload
upload_flags     =
    --before
    no_reset


; ─── ENV: S2 — Giai đoạn 2: Đọc IMU GY-91 (MPU9250) Yaw/Pitch/Roll ─────────
[env:s2]
extends          = env:esp32dev
build_src_filter = -<*> +<stages/stage2_imu.cpp>


; ─── ENV: S3 — Giai đoạn 3: 4x VL53L0X Đa Địa Chỉ I2C ──────────────────────
[env:s3]
extends          = env:esp32dev
build_src_filter = -<*> +<stages/stage3_vl53l0x.cpp>


; ─── ENV: S4 — Giai đoạn 4: GPS GT-U7 (TinyGPS++ / HardwareSerial2) ─────────
[env:s4]
extends          = env:esp32dev
build_src_filter = -<*> +<stages/stage4_gps.cpp>


; ─── ENV: S5 — Giai đoạn 5: Khởi Tạo SIM900A GPRS ──────────────────────────
; Bắt buộc khai báo macro modem TRƯỚC khi TinyGSM được include
[env:s5]
extends          = env:esp32dev
build_flags      =
    ${env:esp32dev.build_flags}
    -DTINY_GSM_MODEM_SIM800
build_src_filter = -<*> +<stages/stage5_sim900a.cpp>


; ─── ENV: S6 — Giai đoạn 6: Điều Khiển qua GPRS HTTP ───────────────────────
[env:s6]
extends          = env:esp32dev
build_flags      =
    ${env:esp32dev.build_flags}
    -DTINY_GSM_MODEM_SIM800
build_src_filter = -<*> +<stages/stage6_gprs_control.cpp>


; ─── ENV: S7 — Giai đoạn 7: Đồng Bộ Firebase qua GPRS ──────────────────────
[env:s7]
extends          = env:esp32dev
build_flags      =
    ${env:esp32dev.build_flags}
    -DTINY_GSM_MODEM_SIM800
build_src_filter = -<*> +<stages/stage7_firebase_sync.cpp>


; ─── ENV: S8 — Giai đoạn 8: Gửi Push Notification qua FCM ──────────────────
[env:s8]
extends          = env:esp32dev
build_flags      =
    ${env:esp32dev.build_flags}
    -DTINY_GSM_MODEM_SIM800
build_src_filter = -<*> +<stages/stage8_fcm_notify.cpp>
